<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitarren Heinz – Designvorschlag (Skizze)</title>
<style>
/* Skizze des Strangs GitarrenHeinz-Design. Eigenständig, offline, keine externen Ressourcen.
   Nicht Teil der App. Zwei Fassungen: vorschlag.html (hell) und vorschlag.html#warm (Nussbaum-Foto, VU-Skala, LED).
   Vier Zustände im Hochformat 426 x 803 px. */
@font-face { font-family: "Archivo Narrow"; font-weight: 600; src: url(../../fonts/archivo-narrow-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Archivo Narrow"; font-weight: 700; src: url(../../fonts/archivo-narrow-latin-700-normal.woff2) format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; background: #bdb9b0; font-family: "Helvetica Neue", Helvetica, Arial, Roboto, system-ui, sans-serif; color: #1f1d1a; }
body.warm { background: #2a1d14; }
.sheet { display: flex; gap: 28px; padding: 28px; width: max-content; }
.cap { font: 600 13px/1.2 Arial, sans-serif; color: #2b2825; margin: 0 0 8px 2px; letter-spacing: .02em; }
body.warm .cap { color: #e9d9b6; }

/* ---------- gemeinsam ---------- */
.phone { width: 426px; height: 803px; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; padding: 0 20px 18px; position: relative; }
.bar { display: flex; align-items: center; justify-content: space-between; height: 58px; flex: none; position: relative; }
.bar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .04em; }
.lang { display: flex; padding: 3px; border-radius: 99px; }
.lang span { padding: 8px 12px; min-width: 48px; text-align: center; border-radius: 99px; font-size: 13px; font-weight: 700; }
.dial { flex: none; position: relative; }
.dial svg { display: block; width: 100%; height: auto; }
.needle { transform-origin: 180px 196px; transition: transform .35s cubic-bezier(.3,1.25,.5,1); }
.zl { font-size: 24px; font-weight: 700; text-anchor: middle; }
.readout { text-align: center; }
.big { font-size: 56px; line-height: 1; font-weight: 700; min-height: 56px; }
.small { margin-top: 6px; font-size: 15px; font-variant-numeric: tabular-nums; min-height: 20px; }
.state { margin-top: 4px; font-size: 15px; font-weight: 700; min-height: 22px; }
.head { flex: 1; min-height: 150px; margin-top: 10px; }
.head svg { width: 100%; height: 100%; display: block; }
.peg text { font-size: 26px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.peg circle.ring { fill: none; stroke: transparent; stroke-width: 2; }
.ctl { flex: none; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { min-height: 52px; border-radius: 14px; font-size: 16px; font-weight: 600; padding: 0 18px; display: flex; align-items: center; justify-content: center; }
.seg { display: flex; padding: 3px; border-radius: 14px; }
.seg span { min-height: 46px; min-width: 112px; display: flex; align-items: center; justify-content: center; border-radius: 11px; font-size: 15px; font-weight: 600; }
.step { display: flex; align-items: center; gap: 8px; }
.step .btn { min-width: 52px; padding: 0; font-size: 22px; }
.step output { min-width: 86px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.led { display: none; }

/* ---------- Fassung hell (angenommener Stil) ---------- */
.hell { background: #e6e3dc; }
.hell .bar h1 { color: #1f1d1a; }
.hell .lang { border: 1px solid #c9c4b8; background: #f5f3ed; }
.hell .lang span { color: #5f5a52; } .hell .lang span.on { background: #1f1d1a; color: #e6e3dc; }
.hell .dial { background: #f5f3ed; border: 1px solid #c9c4b8; border-radius: 18px; padding: 10px 8px 0; box-shadow: inset 0 1px 0 #fff; }
.hell .tick { stroke: #1f1d1a; } .hell .arc { stroke: #1f1d1a; fill: none; }
.hell .zl { fill: #5f5a52; } .hell .zl.hit { fill: #1f1d1a; } .hell .zl.ok { fill: #2f7d45; }
.hell .needle { stroke: #e0561b; } .hell .needle.idle { opacity: .5; }
.hell .hub { fill: #1f1d1a; } .hell .hubdot { fill: #f5f3ed; }
.hell .readout { padding: 6px 0 10px; }
.hell .big.dim { color: #aaa59a; } .hell .small { color: #5f5a52; } .hell .state.ok { color: #2f7d45; }
.hell .peg circle.k { fill: #fbfaf6; stroke: #c9c4b8; stroke-width: 2; } .hell .peg text { fill: #1f1d1a; }
.hell .peg.target circle.k { fill: #1f1d1a; stroke: #1f1d1a; } .hell .peg.target text { fill: #fbfaf6; }
.hell .peg.sel circle.k { fill: #e0561b; stroke: #e0561b; } .hell .peg.sel text { fill: #fff; } .hell .peg.sel circle.ring { stroke: #e0561b; }
.hell .btn { border: 1px solid #c9c4b8; background: #f5f3ed; color: #1f1d1a; box-shadow: 0 1px 0 #fff inset, 0 1px 2px rgba(0,0,0,.06); }
.hell .btn.go { width: 100%; background: #1f1d1a; border-color: #1f1d1a; color: #e6e3dc; font-size: 17px; letter-spacing: .04em; }
.hell .btn.go.on { background: #e0561b; border-color: #e0561b; color: #fff; }
.hell .lbl { font-size: 14px; color: #5f5a52; }
.hell .seg { border: 1px solid #c9c4b8; background: #f5f3ed; }
.hell .seg span { color: #5f5a52; } .hell .seg span.on { background: #1f1d1a; color: #e6e3dc; }

/* ---------- Fassung warm: Nussbaum, VU-Skala, LED, Rackschrift ---------- */
.warm { font-family: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif-condensed, Arial, sans-serif; color: #efe2c4;
  background-color: #3b2417;
  background-image:
    radial-gradient(ellipse 120% 70% at 50% 0%, rgba(255,215,160,.16), rgba(255,215,160,0) 60%),
    linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.32)),
    url(../../img/walnut-panel.jpg);
  background-size: auto, auto, cover; background-position: center; }
.warm > * { position: relative; }
.warm .bar h1, .warm .lbl, .warm .btn, .warm .seg span, .warm .state, .warm .small, .warm output, .warm .lang span { text-transform: uppercase; letter-spacing: .09em; }
.warm .bar h1 { color: #f1e3c4; font-size: 18px; text-shadow: 0 -1px 0 rgba(0,0,0,.55), 0 1px 0 rgba(255,220,170,.14); }
.warm .lang { background: #17110d; border: 1px solid #0b0705; box-shadow: inset 0 1px 3px #000, 0 1px 0 rgba(255,220,170,.12); }
.warm .lang span { color: #a8977b; } .warm .lang span.on { background: #2e251d; color: #ffc65a; text-shadow: 0 0 8px rgba(255,170,40,.7); }
.warm .dial { background: linear-gradient(180deg, #2b2621, #0f0c0a); border-radius: 16px; padding: 9px; margin-bottom: 14px;
  box-shadow: 0 2px 0 rgba(255,220,170,.10), 0 8px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }
.warm .dial .glass { border-radius: 9px; overflow: hidden; position: relative; padding: 6px 4px 0;
  background: radial-gradient(ellipse 85% 120% at 50% 98%, #fff3b0 0%, #f9de78 38%, #e5b843 72%, #c48f26 100%);
  box-shadow: inset 0 3px 8px rgba(70,35,0,.55), inset 0 -2px 5px rgba(255,240,160,.5); }
.warm .dial .glass::after { content: ""; position: absolute; inset: 0 0 55% 0; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events: none; }
.warm .tick { stroke: #2a1a0c; } .warm .arc { stroke: #2a1a0c; fill: none; }
.warm .zl { fill: #3a240f; } .warm .zl.hit { fill: #000; } .warm .zl.ok { fill: #1b5a2d; }
.warm .needle { stroke: #17110c; filter: drop-shadow(2px 2px 1.5px rgba(70,35,0,.45)); } .warm .needle.idle { opacity: 1; }
.warm .hub { fill: #17110c; } .warm .hubdot { fill: #d9a840; }
.warm .scaletxt { font-size: 13px; font-weight: 600; fill: #5a3a14; letter-spacing: .14em; }
.warm .led { display: block; position: absolute; left: 50%; bottom: -17px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%;
  background: linear-gradient(145deg, #d8d3c8, #6f6a60 55%, #cfc9bd); box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.7); padding: 5px; }
.warm .led i { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5a2a24, #2a0e0b 70%); box-shadow: inset 0 1px 3px #000; }
.warm .led.red i { background: radial-gradient(circle at 35% 30%, #ffc9c0, #ff3b2a 38%, #a50f06 100%); box-shadow: 0 0 14px 4px rgba(255,50,30,.75), 0 0 34px 8px rgba(255,40,20,.35); }
.warm .led.yellow i { background: radial-gradient(circle at 35% 30%, #fff8c2, #ffd21f 40%, #c98a00 100%); box-shadow: 0 0 14px 4px rgba(255,205,30,.75), 0 0 34px 8px rgba(255,190,20,.35); }
.warm .led.green i { background: radial-gradient(circle at 35% 30%, #d9ffd0, #3ddc5f 40%, #0d8a2c 100%); box-shadow: 0 0 14px 4px rgba(60,230,100,.7), 0 0 34px 8px rgba(40,220,90,.3); }
.warm .readout { padding: 8px 0 0; }
.warm .big { color: #ffd070; text-shadow: 0 0 14px rgba(255,170,40,.55), 0 2px 0 rgba(0,0,0,.45); }
.warm .big.dim { color: #7d6a50; text-shadow: none; }
.warm .small { color: #e2d2b0; } .warm .state { color: #efe2c4; font-size: 16px; }
.warm .state.bad { color: #ff9a8a; } .warm .state.mid { color: #ffd45a; } .warm .state.ok { color: #8be8a4; }
.warm .head { background: linear-gradient(180deg, #1c1713, #120f0c); border-radius: 14px; padding: 6px 4px; box-shadow: inset 0 2px 6px #000, 0 1px 0 rgba(255,220,170,.12); }
.warm .peg text { fill: #231a12; font-size: 27px; }
.warm .peg.target text { fill: #ffc65a; }
.warm .peg.target circle.k { fill: #221a14; stroke: #ffb02e; stroke-width: 2; }
.warm .peg.sel text { fill: #2a1600; } .warm .peg.sel circle.ring { stroke: #ffc65a; stroke-width: 3; }
.warm .btn { background: linear-gradient(180deg, #2c2620, #14100d); color: #efe2c4; border: 1px solid #070504; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 rgba(0,0,0,.5), 0 3px 6px rgba(0,0,0,.35); }
.warm .btn.go { width: 100%; font-size: 18px; letter-spacing: .16em; }
.warm .btn.go.on { background: linear-gradient(180deg, #ffd072, #e29a1f); color: #2a1600; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 16px rgba(255,170,40,.5), 0 2px 0 rgba(0,0,0,.5); }
.warm .lbl { font-size: 14px; color: #d9c7a0; text-shadow: 0 -1px 0 rgba(0,0,0,.5); }
.warm .seg { background: #120e0b; box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255,220,170,.12); }
.warm .seg span { color: #a8977b; gap: 8px; }
.warm .seg span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3a2c1e; }
.warm .seg span.on { color: #ffc65a; background: linear-gradient(180deg, #2f261d, #1b1510); text-shadow: 0 0 8px rgba(255,170,40,.6); }
.warm .seg span.on::before { background: #ffb02e; box-shadow: 0 0 8px 2px rgba(255,170,40,.8); }
.warm .step output { background: #0f0b08; color: #ffc65a; border-radius: 8px; padding: 12px 8px; box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255,220,170,.12); text-shadow: 0 0 9px rgba(255,170,40,.7); min-width: 100px; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  'use strict';
  var WARM = location.hash === '#warm';
  document.body.className = WARM ? 'warm' : 'hell';
  var TH = WARM ? 'warm' : 'hell';
  // Vorläufige Schwellen in Cent (Vorschlag beim Strang Audio): gestimmt bis ±5, Zielbereich bis ±20, darüber außerhalb.
  var Z0 = 5, Z1 = 20, MAXC = 50, MAXA = 62, R = 155;
  var LEFT = [['D', 'd3'], ['A', 'a2'], ['E', 'e2']];
  var RIGHT = [['G', 'g3'], ['H', 'b3'], ['E', 'e4']];

  function ang(c) { var v = Math.max(-MAXC, Math.min(MAXC, c)); return v / MAXC * MAXA; }
  function pt(r, a) { var t = a * Math.PI / 180; return [180 + r * Math.sin(t), 196 - r * Math.cos(t)]; }
  function arcPath(c0, c1) { var a = pt(R, ang(c0)), b = pt(R, ang(c1)); return 'M' + a[0] + ' ' + a[1] + ' A' + R + ' ' + R + ' 0 0 1 ' + b[0] + ' ' + b[1]; }
  function zone(c) { var a = Math.abs(c); return a <= Z0 ? 0 : (a <= Z1 ? 1 : 2) * (c < 0 ? -1 : 1); }
  function ledState(s) { if (!s.running || s.cents === null) return 'off'; var a = Math.abs(s.cents); return a <= Z0 ? 'green' : (a <= Z1 ? 'yellow' : 'red'); }

  function dialSVG(s) {
    var o = '<svg viewBox="0 34 360 182" role="img" aria-label="Skala">';
    o += '<path class="arc" d="' + arcPath(-MAXC, MAXC) + '" stroke-width="1.5"/>';
    var okc = s.zone === 0 && s.cents !== null;
    if (WARM) {
      o += '<path d="' + arcPath(-MAXC, -Z1) + '" fill="none" stroke="#b5352a" stroke-width="8"/><path d="' + arcPath(Z1, MAXC) + '" fill="none" stroke="#b5352a" stroke-width="8"/>';
      o += '<path d="' + arcPath(-Z1, -Z0) + '" fill="none" stroke="#c97a1a" stroke-width="8"/><path d="' + arcPath(Z0, Z1) + '" fill="none" stroke="#c97a1a" stroke-width="8"/>';
      o += '<path d="' + arcPath(-Z0, Z0) + '" fill="none" stroke="#1f7a38" stroke-width="8"/>';
    } else {
      o += '<path d="' + arcPath(-Z0, Z0) + '" fill="none" stroke="' + (okc ? '#2f7d45' : '#c9c4b8') + '" stroke-width="10"/>';
    }
    for (var c = -MAXC; c <= MAXC; c += 5) {
      var major = (c === 0 || Math.abs(c) === Z0 || Math.abs(c) === Z1 || Math.abs(c) === MAXC);
      var len = c === 0 ? 30 : (major ? 20 : 11);
      var p = pt(R, ang(c)), q = pt(R - len, ang(c));
      o += '<line class="tick" x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '" stroke-width="' + (c === 0 ? 3 : (major ? 2 : 1)) + '"/>';
    }
    [['--', -37.5, -2], ['−', -12.5, -1], ['0', 0, 0], ['+', 12.5, 1], ['++', 37.5, 2]].forEach(function (z) {
      var p = pt(106, ang(z[1])); var hit = s.cents !== null && s.zone === z[2];
      o += '<text class="zl' + (hit ? (z[2] === 0 ? ' ok' : ' hit') : '') + '" x="' + p[0] + '" y="' + (p[1] + 8) + '">' + z[0] + '</text>';
    });
    if (WARM) o += '<text class="scaletxt" x="20" y="208">CENT</text><text class="scaletxt" x="340" y="208" text-anchor="end">440 HZ</text>';
    var rot = s.cents === null ? -MAXA : ang(s.cents);
    o += '<g class="needle' + (s.cents === null ? ' idle' : '') + '" style="transform:rotate(' + rot + 'deg)" stroke-width="3" stroke-linecap="round">' +
      '<line x1="180" y1="196" x2="180" y2="50"/><line x1="180" y1="196" x2="180" y2="214"/></g>';
    o += '<circle class="hub" cx="180" cy="196" r="11"/><circle class="hubdot" cx="180" cy="196" r="3.5"/>';
    return o + '</svg>';
  }

  function defs() {
    return '<defs><radialGradient id="metal" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d4cfc4"/><stop offset="1" stop-color="#8d877b"/></radialGradient>' +
      '<radialGradient id="lit" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#ffc247"/><stop offset="1" stop-color="#d98a10"/></radialGradient>' +
      '<linearGradient id="maple" x1="0" x2="1"><stop offset="0" stop-color="#8e5d3b"/><stop offset=".5" stop-color="#a97248"/><stop offset="1" stop-color="#7d5030"/></linearGradient>' +
      '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  }
  function pegG(label, id, x, y, s) {
    var cls = 'peg', fill = null, sel = false;
    if (s.mode === 'manual' && s.selected === id) { cls += ' sel'; sel = true; if (WARM) fill = 'url(#lit)'; }
    else if (s.mode === 'auto' && s.target === id) cls += ' target';
    else if (WARM) fill = 'url(#metal)';
    var f = fill ? ' fill="' + fill + '" stroke="' + (sel ? '#ffc65a' : '#6f6a60') + '"' : '';
    var glow = (WARM && sel) ? ' filter="url(#glow)"' : '';
    return '<g class="' + cls + '" data-id="' + id + '"><circle class="ring" cx="' + x + '" cy="' + y + '" r="35"/>' +
      '<circle class="k" cx="' + x + '" cy="' + y + '" r="29"' + f + glow + '/><text x="' + x + '" y="' + (y + 1) + '">' + label + '</text></g>';
  }
  function headSVG(s) {
    var o = '<svg viewBox="0 0 360 250" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Kopfplatte">' + defs();
    var ys = [38, 125, 212], lx = 50, rx = 310;
    var shaft = WARM ? '#9a948a' : '#2b2825', body = WARM ? 'url(#maple)' : '#2b2825', nut = WARM ? '#efe2c4' : '#f5f3ed';
    ys.forEach(function (y) {
      o += '<line x1="' + lx + '" y1="' + y + '" x2="118" y2="' + y + '" stroke="' + shaft + '" stroke-width="7" stroke-linecap="round"/>';
      o += '<line x1="' + rx + '" y1="' + y + '" x2="242" y2="' + y + '" stroke="' + shaft + '" stroke-width="7" stroke-linecap="round"/>';
    });
    o += '<path d="M126 6 H234 Q246 6 246 20 V150 L232 244 H128 L114 150 V20 Q114 6 126 6 Z" fill="' + body + '"/>';
    o += '<rect x="128" y="238" width="104" height="5" rx="2" fill="' + nut + '" opacity=".85"/>';
    var nutL = [138, 154, 170], nutR = [190, 206, 222], sc = WARM ? '#f3ead0' : '#e8e5de';
    LEFT.forEach(function (p, i) { o += '<line x1="120" y1="' + ys[i] + '" x2="' + nutL[i] + '" y2="241" stroke="' + sc + '" stroke-width="1.3" opacity=".6"/>'; });
    RIGHT.forEach(function (p, i) { o += '<line x1="240" y1="' + ys[i] + '" x2="' + nutR[i] + '" y2="241" stroke="' + sc + '" stroke-width="1.3" opacity=".6"/>'; });
    LEFT.forEach(function (p, i) { o += pegG(p[0], p[1], lx, ys[i], s); });
    RIGHT.forEach(function (p, i) { o += pegG(p[0], p[1], rx, ys[i], s); });
    return o + '</svg>';
  }

  function phone(title, s) {
    var read, small = '', st = '', stc = '';
    if (!s.running) { read = '<div class="big dim">–</div>'; small = 'Mikrofon aus'; }
    else if (s.cents === null) { read = '<div class="big dim">–</div>'; small = 'Saite anschlagen'; }
    else {
      read = '<div class="big">' + s.note[0] + '</div>';
      small = s.note + ' · ' + s.hz.toFixed(1).replace('.', ',') + ' Hz · ' + (s.cents > 0 ? '+' : (s.cents < 0 ? '−' : '')) + Math.abs(Math.round(s.cents)) + ' ct';
      var a = Math.abs(s.cents);
      if (a <= Z0) { st = 'Gestimmt'; stc = ' ok'; } else { st = s.cents < 0 ? 'Zu tief' : 'Zu hoch'; stc = a <= Z1 ? ' mid' : ' bad'; }
    }
    var ro = '<div class="readout">' + read + '<div class="small">' + small + '</div><div class="state' + stc + '">' + st + '</div></div>';
    var glass = WARM ? '<div class="glass">' + dialSVG(s) + '</div>' : dialSVG(s);
    var led = '<div class="led ' + ledState(s) + '" aria-hidden="true"><i></i></div>';
    return '<div><p class="cap">' + title + '</p><div class="phone ' + TH + '">' +
      '<div class="bar"><h1>Gitarren Heinz</h1><div class="lang"><span class="on">DE</span><span>EN</span></div></div>' +
      '<div class="dial">' + glass + led + (WARM ? '' : ro) + '</div>' + (WARM ? ro : '') +
      '<div class="head">' + headSVG(s) + '</div>' +
      '<div class="ctl">' +
      '<div class="btn go' + (s.running ? ' on' : '') + '">' + (s.running ? 'Stopp' : 'Start') + '</div>' +
      '<div class="row"><span class="lbl">Modus</span><div class="seg"><span class="' + (s.mode === 'auto' ? 'on' : '') + '">Automatik</span><span class="' + (s.mode === 'manual' ? 'on' : '') + '">Manuell</span></div></div>' +
      '<div class="row"><span class="lbl">Bezugston</span><div class="step"><div class="btn">−</div><output>440 Hz</output><div class="btn">+</div></div></div>' +
      '</div></div></div>';
  }
  function mk(cents, note, hz, target, mode, selected, running) {
    return { cents: cents, note: note, hz: hz, target: target, mode: mode, selected: selected, running: running, zone: cents === null ? null : zone(cents) };
  }
  var states = [
    ['1  Keine Eingabe (Mikrofon aus)', mk(null, '', 0, null, 'auto', null, false)],
    ['2  Zu tief, außerhalb Zielbereich (A −31 ct)' + (WARM ? ': LED rot' : ''), mk(-31, 'A2', 106.5, 'a2', 'auto', null, true)],
    ['3  Zu hoch, im Zielbereich (G +12 ct, manuell)' + (WARM ? ': LED gelb' : ''), mk(12, 'G3', 197.4, 'g3', 'manual', 'g3', true)],
    ['4  Gestimmt (E +2 ct)' + (WARM ? ': LED grün' : ''), mk(2, 'E2', 82.5, 'e2', 'auto', null, true)]
  ];
  document.getElementById('sheet').innerHTML = states.map(function (x) { return phone(x[0], x[1]); }).join('');
